pt:{home:'Início',guide:'O guia',buy:'Comprar',contact:'Contacto',footer:'Informação independente · Não somos uma escola de condução nem o IMT.',eyebrow:'A tua carta de condução em Portugal',title:'Queres tirar a carta de condução? Antes de escolheres uma escola, descobre isto.',intro:'Tirar a carta de condução é um passo importante para a tua independência. Mas escolher uma escola só pelo preço ou pela proximidade pode não ser a melhor decisão.',intro2:'Descobre como escolher a escola certa para ti, aumentar as tuas hipóteses de passar à primeira nos exames de código e de condução e evitar despesas desnecessárias. Aprende com prazer, confiança e tranquilidade.',cta:'Descobre o guia',why:'A escolha da escola pode fazer toda a diferença',whytext:'Antes de assinares um contrato, compara a qualidade do ensino, os resultados dos exames, os horários, os instrutores e o custo total. Pergunta o que está incluído e quanto pagarias se precisasses de repetir um exame.',questions:'Há perguntas que vale a pena fazer antes de te inscreveres',items:[['Resultados dos exames','Que percentagem de candidatos passa no exame prático? Os dados referem-se à primeira tentativa ou a todas?'],['Aprender com um tutor','Sabias que existe a possibilidade de praticar com um tutor, mediante condições legais?'],['Custos reais','Compara propostas, aulas adicionais, utilização do carro e custos de repetição dos exames.'],['Aulas à tua medida','Podes escolher o instrutor, os horários ou um carro automático?'],['Exame de código em inglês','Informa-te sobre as condições e a disponibilidade desta opção.'],['Confiança no exame','Prepara-te para situações difíceis e aprende a gerir o nervosismo.']],more:'Muito mais do que uma lista de perguntas',moretext:'O guia acompanha-te desde a escolha da escola até aos exames. Inclui 20 capítulos em 4 partes, 6 ferramentas práticas, uma checklist de 150 perguntas e pontos de atenção e anexos.',topics:'Temas abordados',themes:['Escolha da escola e condições de inscrição','Preços, propostas e contrato','Preparação para o código e a condução','Exames, confiança e próximos passos'],offer:'Investe na tua preparação',access:'Pagamento único · 24 meses de acesso online',format:'Consulta no telemóvel, tablet ou computador. Sem PDF e sem mensalidades.',test:'Versão de teste: a compra e o acesso pessoal ainda não estão ativos.',soon:'Em breve',contacttext:'O contacto será disponibilizado antes do lançamento.',disclaimer:'O guia não garante a aprovação. Confirma as condições legais e os procedimentos junto do IMT e da escola.',faq:'Perguntas frequentes',q1:'Posso descarregar o guia?',a1:'Não. O guia é exclusivamente online.',q2:'O guia garante que passo à primeira?',a2:'Não. Ajuda-te a tomar decisões e a preparar os exames.',tools:'Ferramentas em destaque',tooltext:'Checklist para comparar escolas, comparação de custos e preparação dos exames.'},
en:{home:'Home',guide:'The guide',buy:'Buy',contact:'Contact',footer:'Independent information · Not a driving school or the IMT.',eyebrow:'Your driving licence in Portugal',title:'Getting your driving licence? Discover this before choosing a driving school.',intro:'Getting a driving licence is an important step towards independence. Choosing a school based only on price or location may not be the best decision.',intro2:'Discover how to choose the right school, improve your chances of passing both exams first time and avoid unnecessary expenses. Learn with enjoyment, confidence and peace of mind.',cta:'Discover the guide',why:'Your choice of school can make all the difference',whytext:'Before signing a contract, compare teaching quality, exam results, schedules, instructors and total costs. Ask what is included and what a repeat exam would cost.',questions:'Questions worth asking before enrolling',items:[['Exam results','What proportion of candidates pass the practical exam? Do the figures cover first attempts or all attempts?'],['Practising with a tutor','Did you know supervised practice may be possible under legal conditions?'],['Real costs','Compare offers, additional lessons, exam car use and repeat exam costs.'],['Lessons that suit you','Can you choose your instructor, schedule or an automatic car?'],['Theory exam in English','Ask about conditions and availability.'],['Exam confidence','Prepare for challenging situations and manage nerves.']],more:'Much more than a list of questions',moretext:'The guide supports you from choosing a school to taking the exams. It contains 20 chapters in 4 parts, 6 practical tools, a checklist of 150 questions and points to consider, and appendices.',topics:'Topics covered',themes:['Choosing a school and enrolment requirements','Prices, offers and contracts','Theory and practical preparation','Exams, confidence and next steps'],offer:'Invest in your preparation',access:'One payment · 24 months of online access',format:'Read on you if(id==='buy')content='<section class="section"><div class="container"><h1>'+t.buy+'</h1><div class="price">€ 9,99</div><p><strong>'+t.access+'</strong></p><p>'+t.format+'</p><p class="note">'+t.test+'</p><button class="btn" disabled>'+t.soon+'</button><h2>'+t.faq+'</h2><details><summary>'+t.q1+'</summary><p>'+t.a1+'</p></details><details><summary>'+t.q2+'</summary><p>'+t.a2+'</p></details></div></section>';

</script></body></html>
